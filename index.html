<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- the web playtest page (Editor/BuildWeb.cs builds into it); docs/PLAYTEST.md explains the whole pipeline -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Grow Robot Arms</title>
    <meta name="description" content="Smash the city and grow more robot arms. The current build of a mobile game, free to play in your browser.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Grow Robot Arms">
    <meta property="og:description" content="Smash the city and grow more robot arms. The current build of a mobile game, free to play in your browser.">
    <meta property="og:url" content="https://chrisli328.github.io/grow-robot-arms/">
    <meta property="og:image" content="https://chrisli328.github.io/grow-robot-arms/html/img/share.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="html/img/slot-grab.webp">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141a2e;
        overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; touch-action: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #141a2e; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        background: #141a2e url('TemplateData/load-key.jpg') center / cover no-repeat; transition: opacity .35s; z-index: 2; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #bootBox { width: min(78vw, 420px); margin-bottom: 9vh; font: 600 15px/1.3 system-ui, sans-serif; color: #fff;
        text-align: center; text-shadow: 0 2px 4px #000c; }
      #bootTrack { height: 14px; border-radius: 8px; background: #0009; border: 2px solid #fff; overflow: hidden; margin-top: 8px; }
      #bootBar { height: 100%; width: 0; background: #ffd23a; transition: width .2s; }
      #bootErr { display: none; padding: 14px; border-radius: 10px; background: #000c; white-space: pre-wrap; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="boot">
      <div id="bootBox">
        <div id="bootText">Loading Grow Robot Arms</div>
        <div id="bootTrack"><div id="bootBar"></div></div>
        <div id="bootErr"></div>
      </div>
    </div>
    <script src="Build/web.loader.js"></script>
    <script>
      var canvas = document.querySelector('#unity-canvas');
      var config = {
        arguments: [],
        dataUrl: 'Build/web.data.unityweb',
        frameworkUrl: 'Build/web.framework.js.unityweb',
        codeUrl: 'Build/web.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "FINIFUGU",
        productName: "Grow Robot Arms",
        productVersion: "0.1.0",
        // sharp on phones without drawing 3x pixels: the prototype capped its renderer at 2 the same way
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // the save (PlayerPrefs) is written to the browser's storage as soon as it changes
        autoSyncPersistentDataPath: true,
      };
      var bar = document.querySelector('#bootBar');
      function fail(msg) {
        var e = document.querySelector('#bootErr');
        document.querySelector('#bootTrack').style.display = 'none';
        document.querySelector('#bootText').textContent = 'The game could not start';
        e.style.display = 'block'; e.textContent = String(msg);
        window.__graBootError = String(msg);
      }
      createUnityInstance(canvas, config, function (p) { bar.style.width = Math.round(p * 100) + '%'; })
        .then(function (inst) {
          window.unityInstance = inst;
          document.querySelector('#boot').classList.add('gone');
          canvas.focus();
        })
        .catch(fail);
    </script>
  </body>
</html>
